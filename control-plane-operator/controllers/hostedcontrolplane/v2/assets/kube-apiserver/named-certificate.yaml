apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-api-cert
spec:
  subject:
    organizations:
      - "Red Hat - Hypershift"
  usages:
    - server auth
    - client auth
  duration: 2160h    # 90 days - maximum expiration from Let's Encrypt
  renewBefore: 720h  # 30 days before expiration - recommended renewal window
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  dnsNames: []  # Populated by adaptNamedCertificate based on API server hostname
  secretName: external-api-cert
  issuerRef:
    name: public-issuer
    kind: ClusterIssuer
    group: cert-manager.io
